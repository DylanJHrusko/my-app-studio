{% extends "base.html" %}
{% block title %}Log in · {{ brand.name }}{% endblock %}
{% block content %}
<section class="form-stack" aria-labelledby="login-title">
  <p class="eyebrow">Member access</p>
  <h1 id="login-title">Log in</h1>
  {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required maxlength="32"{% if username %} value="{{ username }}"{% endif %}>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128">
    <button class="button" type="submit">Log in</button>
  </form>
  <p>New here? <a class="text-link" href="/signup">Create an account</a></p>
</section>
{% endblock %}
